# Codemagic equivalent of .github/workflows/build.yml (unsigned .ipa for sideloading).
# For a signed build, add your certificate and profile under Team settings >
# Code signing identities and use Codemagic's `ios_signing` block with
# distribution_type: development — a development signature is what carries
# get-task-allow (docs/JIT.md).
workflows:
  ios-unsigned:
    name: Ember unsigned IPA
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Install tools
        script: brew install xcodegen ldid
      - name: Core tests (host)
        script: |
          cmake -S . -B build-host -DCMAKE_BUILD_TYPE=Release
          cmake --build build-host --parallel
          ctest --test-dir build-host --output-on-failure
      - name: Generate project
        script: xcodegen generate
      - name: Build
        script: |
          xcodebuild -project Ember.xcodeproj -scheme Ember -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package
        script: |
          APP=build/Build/Products/Release-iphoneos/Ember.app
          ldid -SResources/Ember.entitlements "$APP/Ember"
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry Ember-unsigned.ipa Payload
    artifacts:
      - Ember-unsigned.ipa
