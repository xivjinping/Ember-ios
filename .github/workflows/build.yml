name: Build

# Produces an .ipa on every push.
#
#   * Always:  Ember-unsigned.ipa — for AltStore / SideStore / Sideloadly, which
#              sign it with your own Apple ID when they install it.
#   * If the signing secrets below are set: Ember.ipa, signed with your
#              development certificate and provisioning profile.
#
# Signing secrets (Settings > Secrets and variables > Actions):
#   BUILD_CERTIFICATE_BASE64      base64 of your "Apple Development" .p12
#   P12_PASSWORD                  the password you exported it with
#   PROVISIONING_PROFILE_BASE64   base64 of a *development* .mobileprovision
#                                 that includes that certificate and your device
#
# Use a development certificate and profile, not distribution/ad hoc: only a
# development signature carries get-task-allow, which JIT depends on
# (docs/JIT.md). The bundle ID and team are read from the profile.

on:
  push:
    paths-ignore:
      - 'Dependencies/**'
      - '.github/workflows/deps.yml'
      - 'docs/**'
      - '**.md'
  pull_request:
  workflow_dispatch:
  # New xemu libraries: build the app again so it links them.
  workflow_run:
    workflows: ["iOS dependencies"]
    types: [completed]

jobs:
  # The portable core is tested on Linux: fast, and no Apple hardware needed.
  core-tests:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  ipa:
    runs-on: macos-latest
    needs: core-tests
    permissions:
      contents: write   # to publish the "latest" release
    env:
      # Secrets cannot be tested in a step's `if:` directly, so reduce them to a flag here.
      HAS_SIGNING: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.PROVISIONING_PROFILE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install tools
        run: brew install xcodegen ldid

      # The xemu libraries come from the "iOS dependencies" workflow, which
      # saves a new cache entry on every successful run; take the newest.
      # Without them the app is built with the stub backend.
      - name: Restore xemu libraries
        uses: actions/cache/restore@v4
        with:
          path: build-deps/xemu-lib
          key: xemu-ios-lib-none
          restore-keys: xemu-ios-lib-

      - name: Show which backend is linked
        run: |
          if [ -f build-deps/xemu-lib/ember-xemu.xcconfig ]; then
            echo "Backend: xemu"; ls -la build-deps/xemu-lib
          else
            echo "::warning::xemu libraries not found in the cache; building with the stub backend."
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      # ---- Unsigned build (always) -----------------------------------------
      - name: Build without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project Ember.xcodeproj -scheme Ember -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned .ipa
        run: |
          APP=build/Build/Products/Release-iphoneos/Ember.app
          # An unsigned binary carries no entitlements. Ad-hoc sign with ldid so
          # they are embedded; sideloading tools read them from the binary and
          # keep the ones the user's profile allows.
          ldid -SResources/Ember.entitlements "$APP/Ember"
          # Printed so the log shows what was linked without downloading the .ipa.
          if nm "$APP/Ember" 2>/dev/null | grep -q ' _ember_xemu_state$'; then BACKEND=xemu; else BACKEND=stub; fi
          echo "linked backend: $BACKEND"
          echo "LINKED_BACKEND=$BACKEND" >> "$GITHUB_ENV"
          ls -la "$APP/Ember"
          mkdir -p unsigned/Payload
          cp -R "$APP" unsigned/Payload/
          (cd unsigned && zip -qry ../Ember-unsigned.ipa Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: Ember-unsigned-ipa
          path: Ember-unsigned.ipa
          if-no-files-found: error

      # One fixed download link for the newest build of main:
      #   https://github.com/<owner>/<repo>/releases/download/latest/Ember-unsigned.ipa
      # Only builds with the xemu backend replace it, so a stub build never
      # overwrites a working one.
      - name: Publish to the "latest" release
        if: >-
          github.ref == 'refs/heads/main' && env.LINKED_BACKEND == 'xemu' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
           github.event_name == 'workflow_run')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete latest --cleanup-tag --yes 2>/dev/null || true
          gh release create latest Ember-unsigned.ipa \
            --target "$GITHUB_SHA" --prerelease --title "Latest build" \
            --notes "Newest build of main ($(git rev-parse --short HEAD), $(date -u '+%Y-%m-%d %H:%M UTC')). Unsigned: install with AltStore, SideStore or Sideloadly."

      # ---- Signed build (only when secrets are configured) -----------------
      - name: Install certificate and provisioning profile
        if: env.HAS_SIGNING == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          CERT="$RUNNER_TEMP/certificate.p12"
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT"
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE"

          # A throwaway keychain that exists only for this job.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN"

          # Read what xcodebuild needs straight from the profile.
          security cms -D -i "$PROFILE" > "$PROFILE_PLIST"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
          TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")
          BUNDLE_ID="${APP_ID#*.}"
          # A wildcard profile (TEAM.*) fits any ID; keep the project's own.
          if [ "$BUNDLE_ID" = "*" ]; then BUNDLE_ID="app.ember.Ember"; fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

          {
            echo "SIGNING_KEYCHAIN=$KEYCHAIN"
            echo "PROFILE_NAME=$NAME"
            echo "TEAM_ID=$TEAM"
            echo "BUNDLE_ID=$BUNDLE_ID"
          } >> "$GITHUB_ENV"

      - name: Archive (signed)
        if: env.HAS_SIGNING == 'true'
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Ember.xcodeproj -scheme Ember -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Ember.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Development" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID"

      - name: Export signed .ipa
        if: env.HAS_SIGNING == 'true'
        run: |
          set -euo pipefail
          # "debugging" is the development export method (it was called
          # "development" before Xcode 15.3). It keeps get-task-allow.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>debugging</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>stripSwiftSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/Ember.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          # Fail loudly if the result cannot support JIT.
          codesign -d --entitlements - --xml build/Ember.xcarchive/Products/Applications/Ember.app \
            > "$RUNNER_TEMP/entitlements.plist" 2>/dev/null || true
          if [ "$(/usr/libexec/PlistBuddy -c 'Print :get-task-allow' "$RUNNER_TEMP/entitlements.plist" 2>/dev/null)" != "true" ]; then
            echo "::error::The signed app has no get-task-allow. Use a development certificate and profile."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: env.HAS_SIGNING == 'true'
        with:
          name: Ember-signed-ipa
          path: build/export/*.ipa
          if-no-files-found: error

      - name: Remove signing material
        if: always() && env.HAS_SIGNING == 'true'
        run: |
          security delete-keychain "$SIGNING_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP"/certificate.p12 "$RUNNER_TEMP"/profile.mobileprovision "$RUNNER_TEMP"/profile.plist
