name: iOS dependencies

# Work on the emulation core, kept apart from the app build so that an
# experiment here cannot break the app, and app changes do not rebuild this.
#
#   1. Cross-compile the third-party libraries for iOS arm64 (cached).
#   2. Fetch the pinned xemu revision, apply Ember's iOS changes, configure it.
#   3. Compile it and summarise the errors.

on:
  workflow_dispatch:
  push:
    paths:
      - 'Dependencies/**'
      - '.github/workflows/deps.yml'

jobs:
  deps:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install meson ninja pkgconf

      # The libraries only change when their build script does.
      - name: Restore library cache
        id: prefix
        uses: actions/cache/restore@v4
        with:
          path: build-deps/prefix
          key: ios-prefix-${{ hashFiles('Dependencies/build-ios-deps.sh') }}

      - name: Build libraries
        if: steps.prefix.outputs.cache-hit != 'true'
        run: Dependencies/build-ios-deps.sh

      # Saved here, not at the end of the job, so that a failure in the xemu
      # steps below does not throw away twenty minutes of library builds.
      - name: Save library cache
        if: steps.prefix.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build-deps/prefix
          key: ios-prefix-${{ hashFiles('Dependencies/build-ios-deps.sh') }}

      - name: Show meson logs on failure
        if: failure()
        run: |
          for f in build-deps/*/meson-logs/meson-log.txt; do
            [ -f "$f" ] && { echo "==== $f (last 150 lines)"; tail -150 "$f"; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ios-deps-prefix
          path: build-deps/prefix
          if-no-files-found: error

      # xemu's DSP library is Rust and has no iOS release; build it from source.
      - name: Restore DSP library cache
        id: dsp
        uses: actions/cache/restore@v4
        with:
          path: build-deps/dsp56300
          key: ios-dsp56300-${{ hashFiles('Dependencies/xemu/build-dsp56300-ios.sh') }}

      - name: Build DSP library for iOS
        if: steps.dsp.outputs.cache-hit != 'true'
        run: Dependencies/xemu/build-dsp56300-ios.sh

      - name: Save DSP library cache
        if: steps.dsp.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build-deps/dsp56300
          key: ios-dsp56300-${{ hashFiles('Dependencies/xemu/build-dsp56300-ios.sh') }}

      - name: Configure xemu for iOS
        run: Dependencies/xemu/configure-xemu-ios.sh

      - name: Compile xemu for iOS
        run: Dependencies/xemu/compile-xemu-ios.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xemu-compile-log
          path: build-deps/xemu-compile.log
          if-no-files-found: ignore

      - name: Show xemu configure logs on failure
        if: failure()
        run: |
          for f in build-deps/xemu-build/config.log build-deps/xemu-build/meson-logs/meson-log.txt; do
            [ -f "$f" ] && { echo "==== $f (last 120 lines)"; tail -120 "$f"; }
          done
