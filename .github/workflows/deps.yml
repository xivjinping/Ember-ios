name: iOS dependencies

# Cross-compiles the engine's library dependencies for iOS. Separate from the
# app build so that work on the port does not slow down every app change.

on:
  workflow_dispatch:
  push:
    paths:
      - 'Dependencies/**'
      - '.github/workflows/deps.yml'

jobs:
  deps:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install meson ninja pkgconf

      - name: Build
        run: Dependencies/build-ios-deps.sh

      - name: Show meson log on failure
        if: failure()
        run: |
          for f in build-deps/*/meson-logs/meson-log.txt; do
            [ -f "$f" ] && { echo "==== $f (last 150 lines)"; tail -150 "$f"; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ios-deps-prefix
          path: build-deps/prefix
          if-no-files-found: error
