name: iOS dependencies

# Cross-compiles the third-party libraries the emulation core needs, for iOS
# arm64. Separate from the app build so a dependency experiment does not break
# the app, and vice versa.

on:
  push:
    paths:
      - 'Dependencies/ios/**'
      - '.github/workflows/deps.yml'
  workflow_dispatch:

jobs:
  glib:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install meson ninja pkgconf

      - name: Build GLib for iOS
        run: Dependencies/ios/build-glib.sh

      - name: Package prefix
        run: tar -czf ios-prefix.tar.gz -C Dependencies/ios prefix

      - uses: actions/upload-artifact@v4
        with:
          name: ios-arm64-prefix
          path: ios-prefix.tar.gz
          if-no-files-found: error
